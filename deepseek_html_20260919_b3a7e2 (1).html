function switchTab(tabId, btn) {

  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  btn.classList.add('active');

var gapChapters = Object.keys(gapData);
var currentGapChapter = gapChapters[0];

function renderGapChapters() {
  var container = document.getElementById('gapChapters');
  container.innerHTML = '';
  gapChapters.forEach(function(ch) {
    var btn = document.createElement('button');
    btn.className = 'chap-btn' + (ch === currentGapChapter ? ' active' : '');
    btn.textContent = ch;
    btn.onclick = function() { currentGapChapter = ch; renderGapChapters(); renderGapExercises(); };
    container.appendChild(btn);
  });
}

function renderGapExercises() {
  var container = document.getElementById('gapContainer');
  container.innerHTML = '';
  var exercises = gapData[currentGapChapter] || [];
  exercises.forEach(function(ex, exIdx) {
    var div = document.createElement('div');
    div.className = 'exercise';
    var html = '<h3>' + ex.title + ' <span class="badge">' + ex.answers.length + ' gaps</span></h3><div class="text-block">';
    var parts = ex.text.split(/\{\{(\d+)\}\}/);
    parts.forEach(function(part) {
      if (/^\d+$/.test(part)) {
        var idx = parseInt(part) - 1;
        html += '<input type="text" class="gap-input" data-ex="' + exIdx + '" data-gap="' + idx + '" placeholder="' + (idx+1) + '" autocomplete="off">';
      } else {
        html += part;
      }
    });
    html += '</div><div class="btn-group">' +
      '<button class="btn btn-success" onclick="checkExercise(' + exIdx + ')">✅ Kiểm tra</button>' +
      '<button class="btn btn-warning" onclick="revealExercise(' + exIdx + ')">👁️ Đáp án</button>' +
      '<button class="btn btn-secondary" onclick="resetExercise(' + exIdx + ')">🔄 Làm lại</button>' +
      '</div><div class="result-msg" id="result-' + exIdx + '"></div>';
    div.innerHTML = html;
    container.appendChild(div);
  });
}

function normalize(str) {
  return str.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.,;:!?]$/, '');
}

function checkExercise(exIdx) {
  var inputs = document.querySelectorAll('.gap-input[data-ex="' + exIdx + '"]');
  var answers = gapData[currentGapChapter][exIdx].answers;
  var correct = 0;
  for (var i = 0; i < inputs.length; i++) {
    var inp = inputs[i];
    var idx = parseInt(inp.dataset.gap);
    inp.classList.remove('correct','wrong','revealed');
    if (normalize(inp.value) === normalize(answers[idx])) {
      inp.classList.add('correct');
      correct++;
    } else {
      inp.classList.add('wrong');
    }
  }
  var msg = document.getElementById('result-' + exIdx);
  msg.className = 'result-msg show ' + (correct === inputs.length ? 'success' : 'error');
  msg.textContent = 'Bạn đúng ' + correct + '/' + inputs.length + ' chỗ trống.';
}

function revealExercise(exIdx) {
  var inputs = document.querySelectorAll('.gap-input[data-ex="' + exIdx + '"]');
  var answers = gapData[currentGapChapter][exIdx].answers;
  for (var i = 0; i < inputs.length; i++) {
    var inp = inputs[i];
    var idx = parseInt(inp.dataset.gap);
    inp.value = answers[idx];
    inp.classList.remove('correct','wrong');
    inp.classList.add('revealed');
  }
  var msg = document.getElementById('result-' + exIdx);
  msg.className = 'result-msg show';
  msg.style.background = '#fffff0';
  msg.style.color = '#744210';
  msg.style.borderLeft = '4px solid #d69e2e';
  msg.textContent = '👁️ Đã hiển thị đáp án.';
}

function resetExercise(exIdx) {
  var inputs = document.querySelectorAll('.gap-input[data-ex="' + exIdx + '"]');
  for (var i = 0; i < inputs.length; i++) {
    inputs[i].value = '';
    inputs[i].classList.remove('correct','wrong','revealed');
  }
  var msg = document.getElementById('result-' + exIdx);
  msg.className = 'result-msg';
  msg.textContent = '';
}

var flashChapters = Object.keys(keyTermsData);

function buildFlashCards() {
  flashCards = [];
  var chapters = currentFlashChapter === 'All' ? flashChapters : [currentFlashChapter];
  chapters.forEach(function(ch) {

    terms.forEach(function(pair) {
      flashCards.push({ word: pair[0], def: pair[1], chapter: ch });
    });
  });
  flashIndex = 0;
  flashShowingDef = false;
  updateFlashcard();
}

function renderFlashChapters() {
  var container = document.getElementById('flashChapters');
  container.innerHTML = '';
  var allBtn = document.createElement('button');
  allBtn.className = 'chap-btn' + (currentFlashChapter === 'All' ? ' active' : '');
  allBtn.textContent = '📚 Tất cả';
  allBtn.onclick = function() { currentFlashChapter = 'All'; renderFlashChapters(); buildFlashCards(); };
  container.appendChild(allBtn);
  flashChapters.forEach(function(ch) {
    var btn = document.createElement('button');
    btn.className = 'chap-btn' + (ch === currentFlashChapter ? ' active' : '');
    btn.textContent = ch;
    btn.onclick = function() { currentFlashChapter = ch; renderFlashChapters(); buildFlashCards(); };
    container.appendChild(btn);
  });
}

function updateFlashcard() {
  var fc = document.getElementById('flashcard');
  var label = document.getElementById('flashLabel');
  var content = document.getElementById('flashContent');
  if (!fc) return;

  if (flashCards.length === 0) {
    label.textContent = 'KEY TERM';
    content.textContent = 'Không có dữ liệu';
    document.getElementById('flashCounter').textContent = '0 / 0';
    return;
  }

  var card = flashCards[flashIndex];

  if (flashShowingDef) {
    fc.classList.add('showing-def');
    label.textContent = 'DEFINITION';
    content.textContent = card.def;
  } else {
    fc.classList.remove('showing-def');
    label.textContent = 'KEY TERM';
    content.textContent = card.word;
  }

  document.getElementById('flashCounter').textContent = (flashIndex + 1) + ' / ' + flashCards.length;
}

// Nút lật thẻ - chỉ đổi nội dung
document.getElementById('flashFlipBtn').onclick = function(e) {
  e.preventDefault();
  flashShowingDef = !flashShowingDef;
  updateFlashcard();
};

// Nhấn phím Space để lật
document.addEventListener('keydown', function(e) {
  if (e.code === 'Space') {
    var flashTab = document.getElementById('flashcard');
    if (flashTab && flashTab.classList.contains('active')) {
      e.preventDefault();
      flashShowingDef = !flashShowingDef;
      updateFlashcard();
    }
  }
});

document.getElementById('flashNext').onclick = function(e) {
  e.stopPropagation();
  if (flashCards.length === 0) return;
  flashIndex = (flashIndex + 1) % flashCards.length;
  flashShowingDef = false;
  updateFlashcard();
};

document.getElementById('flashPrev').onclick = function(e) {
  e.stopPropagation();
  if (flashCards.length === 0) return;
  flashIndex = (flashIndex - 1 + flashCards.length) % flashCards.length;
  flashShowingDef = false;
  updateFlashcard();
};

document.getElementById('flashShuffle').onclick = function(e) {
  e.stopPropagation();
  for (var i = flashCards.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = flashCards[i];
    flashCards[i] = flashCards[j];
    flashCards[j] = temp;
  }
  flashIndex = 0;
  flashShowingDef = false;
  updateFlashcard();
};

var quizChapters = Object.keys(keyTermsData);
var currentQuizChapter = 'All';
var quizQuestions = [];
var quizAnswers = {};

function renderQuizChapters() {
  var container = document.getElementById('quizChapters');
  container.innerHTML = '';
  var allBtn = document.createElement('button');
  allBtn.className = 'chap-btn' + (currentQuizChapter === 'All' ? ' active' : '');
  allBtn.textContent = '📚 Tất cả';
  allBtn.onclick = function() { currentQuizChapter = 'All'; renderQuizChapters(); buildQuiz(); };
  container.appendChild(allBtn);
  quizChapters.forEach(function(ch) {
    var btn = document.createElement('button');
    btn.className = 'chap-btn' + (ch === currentQuizChapter ? ' active' : '');
    btn.textContent = ch;
    btn.onclick = function() { currentQuizChapter = ch; renderQuizChapters(); buildQuiz(); };
    container.appendChild(btn);
  });
}

function buildQuiz() {
  var pool = [];
  var chapters = currentQuizChapter === 'All' ? quizChapters : [currentQuizChapter];
  chapters.forEach(function(ch) {
    var terms = keyTermsData[ch] || [];
    terms.forEach(function(pair) {
      pool.push({ word: pair[0], def: pair[1], chapter: ch });
    });
  });
  pool = pool.sort(function() { return Math.random() - 0.5; }).slice(0, 10);
  quizQuestions = pool.map(function(q) {
    var wrongPool = pool.filter(function(x) { return x.word !== q.word; }).sort(function() { return Math.random() - 0.5; }).slice(0, 3);
    var options = [q.def];
    wrongPool.forEach(function(w) { options.push(w.def); });
    options.sort(function() { return Math.random() - 0.5; });
    return { word: q.word, correct: q.def, options: options, chapter: q.chapter };
  });
  quizAnswers = {};
  renderQuiz();
}

function renderQuiz() {
  var container = document.getElementById('quizContainer');
  container.innerHTML = '';
  var scoreEl = document.getElementById('quizScore');
  scoreEl.classList.remove('show');
  if (quizQuestions.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#a0aec0;padding:40px;">Không có câu hỏi.</p>';
    return;
  }
  quizQuestions.forEach(function(q, i) {
    var div = document.createElement('div');
    div.className = 'quiz-question';
    var html = '<div class="q-text">' + (i+1) + '. "' + q.word + '" có nghĩa là gì?</div>';
    q.options.forEach(function(opt, j) {
      html += '<label class="quiz-option" data-q="' + i + '" data-opt="' + j + '">' +
        '<input type="radio" name="q' + i + '" value="' + j + '" style="margin-right:10px;">' + opt +
        '</label>';
    });
    div.innerHTML = html;
    container.appendChild(div);
  });
  var opts = document.querySelectorAll('.quiz-option');
  for (var i = 0; i < opts.length; i++) {
    opts[i].onclick = function() {
      var qIdx = parseInt(this.dataset.q);
      var siblings = document.querySelectorAll('.quiz-option[data-q="' + qIdx + '"]');
      for (var k = 0; k < siblings.length; k++) siblings[k].classList.remove('selected');
      this.classList.add('selected');
      this.querySelector('input').checked = true;
      quizAnswers[qIdx] = parseInt(this.dataset.opt);
    };
  }
}

document.getElementById('quizSubmit').onclick = function() {
  if (quizQuestions.length === 0) return;
  var correct = 0;
  quizQuestions.forEach(function(q, i) {
    var selected = quizAnswers[i];
    var opts = document.querySelectorAll('.quiz-option[data-q="' + i + '"]');
    for (var k = 0; k < opts.length; k++) {
      var opt = opts[k];
      var optIdx = parseInt(opt.dataset.opt);
      opt.classList.remove('correct','wrong','selected');
      if (q.options[optIdx] === q.correct) opt.classList.add('correct');
      else if (selected === optIdx) opt.classList.add('wrong');
    }
    if (selected !== undefined && q.options[selected] === q.correct) correct++;
  });
  var scoreEl = document.getElementById('quizScore');
  scoreEl.classList.add('show');
  var percent = Math.round(correct / quizQuestions.length * 100);
  var color = percent >= 70 ? '#38a169' : (percent >= 40 ? '#d69e2e' : '#e53e3e');
  var comment = percent >= 80 ? '🌟 Xuất sắc!' : (percent >= 60 ? '👍 Khá tốt!' : '💪 Cần ôn thêm!');
  scoreEl.innerHTML = '🎯 Kết quả: <span style="color:' + color + '">' + correct + '/' + quizQuestions.length + '</span> (' + percent + '%)<br><span style="font-size:14px;color:#718096;">' + comment + '</span>';
};

document.getElementById('quizReset').onclick = function() {
  buildQuiz();
};

renderGapChapters();
renderGapExercises();
renderTermChapters();
renderTerms();
renderFlashChapters();
buildFlashCards();
renderQuizChapters();
buildQuiz();
</script>
